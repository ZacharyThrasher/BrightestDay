[package]
name = "bd_sim"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
bd_core.workspace = true
bd_voxel.workspace = true
# Held swing curves: hitboxes are swept along the same curves the client animates (held.rs).
bd_shapes.workspace = true
glam.workspace = true
serde.workspace = true
# Oath table (assets/oaths.ron) — the sim only needs each oath's length.
ron.workspace = true

[dev-dependencies]
proptest.workspace = true
bincode.workspace = true
# examples/powers_check.rs: the lexicon's own scan of power files (name clashes, coverage).
bd_lexicon.workspace = true

[features]
default = ["backrooms", "ember", "mirror", "casino", "valley", "lair", "hyperline"]
# BACKROOMS map (bd_voxel feature; the route example needs it).
backrooms = ["bd_voxel/backrooms"]
# TURTLE LAIR map (bd_voxel feature; the route example needs it).
lair = ["bd_voxel/lair"]
# HIGH ROLLER casino map (bd_voxel feature; the route example needs it).
casino = ["bd_voxel/casino"]
# EMBER map (bd_voxel feature; the route example and tests/ember.rs need it).
ember = ["bd_voxel/ember"]
# SAKURA KEEP map (bd_voxel feature; the route example needs it).
sakura = ["bd_voxel/sakura"]
# MIRRORFOLD map (bd_voxel feature; the route example needs it).
mirror = ["bd_voxel/mirror"]
# HYPERLINE map (bd_voxel feature; tests/hyperline.rs and the route example need it).
hyperline = ["bd_voxel/hyperline"]
# CYBERTRON map (bd_voxel feature; the route example needs it).
cybertron = ["bd_voxel/cybertron"]
# VALLEY OF THE END map (bd_voxel feature; the route example and tests/valley.rs need it).
valley = ["bd_voxel/valley"]
# GIANT'S ROOM map (bd_voxel feature; the route example needs it).
giant = ["bd_voxel/giant"]

[[example]]
name = "backrooms_routes"
required-features = ["backrooms"]

[[example]]
name = "casino_routes"
required-features = ["casino"]

[[example]]
name = "lair_routes"
required-features = ["lair"]

[[example]]
name = "ember_routes"
required-features = ["ember"]

[[example]]
name = "sakura_routes"
required-features = ["sakura"]

[[example]]
name = "mirror_routes"
required-features = ["mirror"]

[[example]]
name = "hyperline_routes"
required-features = ["hyperline"]

[[example]]
name = "cybertron_routes"
required-features = ["cybertron"]

[[example]]
name = "valley_routes"
required-features = ["valley"]

[[example]]
name = "giant_routes"
required-features = ["giant"]
