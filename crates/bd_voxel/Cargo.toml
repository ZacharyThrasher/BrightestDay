[package]
name = "bd_voxel"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
bd_core.workspace = true
glam.workspace = true
serde.workspace = true

[dev-dependencies]
proptest.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }

[features]
default = ["backrooms"]
# BACKROOMS map (maps/backrooms.rs).
backrooms = []
# TURTLE LAIR map (maps/lair.rs).
lair = []
# VALLEY OF THE END map (maps/valley.rs).
valley = []

[[example]]
name = "backrooms_preview"
required-features = ["backrooms"]

[[example]]
name = "lair_preview"
required-features = ["lair"]

[[example]]
name = "valley_preview"
required-features = ["valley"]
