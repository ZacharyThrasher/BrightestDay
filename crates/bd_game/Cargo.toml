[package]
name = "bd_game"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "brightest_day"
path = "src/main.rs"

[features]
default = ["music"]
# Dev-only: faster incremental links (`cargo run -p bd_game --features dev`). Never ship with this.
dev = ["bevy/dynamic_linking"]
# Profiling: writes a chrome://tracing JSON (trace-*.json) in the working directory.
# Build into a separate target dir to avoid rebuilding Bevy back and forth.
profile = ["bevy/trace_chrome"]
# Perf checks: counting global allocator, prints `ALLOCS` per-frame allocation stats in game.
alloc-count = []
# Push-to-talk voice casting (local Whisper on CPU; needs CMake + MSVC, see crates/bd_voice/README.md).
voice = ["bd_voice/whisper"]
# The chip soundtrack on bd_audio's Music bus (bd_music).
music = ["bd_audio/music", "dep:bd_music"]

[dependencies]
bd_core.workspace = true
bd_voxel.workspace = true
bd_sim.workspace = true
bd_lexicon.workspace = true
bd_voice.workspace = true
bd_shapes.workspace = true
bd_fx.workspace = true
bd_net.workspace = true
bd_audio.workspace = true
bd_music = { path = "../bd_music", optional = true }
serde.workspace = true
ron.workspace = true
bytemuck = { version = "1", features = ["derive"] }
bevy = { version = "0.19.1" }
